[package]
name = "animation"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/animation.rs"
crate-type = ["rlib"]

[dependencies]
bridge = { version = "0.1.0", path = "../bridge" }
js-sys = { version = "0.3", optional = true }
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsify-next = { version = "0.5", optional = true }
wasm-bindgen = { version = "0.2.115", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Performance"] }

[features]
wasm = ["dep:wasm-bindgen", "dep:tsify-next", "dep:js-sys", "dep:web-sys", "tsify-next/js"]
