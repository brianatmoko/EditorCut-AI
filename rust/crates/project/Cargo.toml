[package]
name = "project"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/project.rs"
crate-type = ["rlib"]

[dependencies]
bridge = { version = "0.1.0", path = "../bridge" }
time = { version = "0.1.0", path = "../time" }
timeline = { version = "0.1.0", path = "../timeline" }
serde = { version = "1", features = ["derive"] }
tsify-next = { version = "0.5", optional = true }
wasm-bindgen = { version = "0.2.115", optional = true }

[features]
wasm = ["dep:wasm-bindgen", "dep:tsify-next", "tsify-next/js"]
