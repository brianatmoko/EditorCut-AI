[package]
name = "opencut-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "opencut"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
animation = { path = "../../rust/crates/animation" }
spine-runtime = { path = "../../rust/crates/spine_runtime" }
commands = { path = "../../rust/crates/commands" }
media = { path = "../../rust/crates/media" }
project = { path = "../../rust/crates/project" }
timeline = { path = "../../rust/crates/timeline" }
time = { path = "../../rust/crates/time" }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
rfd = "0.15"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

